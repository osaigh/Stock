<div class="container-fluid">
  <div class="row">
    <div class="col-md-6">
      <div class="card strpied-tabled-with-hover">
        <div class="card-header">
          <div class="card-title">Stocks</div>
        </div>
        <div class="card-body">
          <p class="card-category">Stock prices</p>
          <table class="table table-hover table-striped" id="stockTable">
            <thead>
              <tr>
                <th class="border-0">#</th>
                <th class="border-0">Name</th>
                <th class="border-0">Price</th>
                <th class="border-0"></th>
              </tr>
            </thead>
            <tbody>
              @for (stock of stocks(); track stock.stockId; let i = $index) {
                <tr>
                  <td>{{ i + 1 }}</td>
                  <td>{{ stock.stockId }}</td>
                  <td>{{ stock.price | currency: 'USD' : 'symbol' : '1.2-2' }}</td>
                  <td>
                    <button type="button" class="btn btn-primary" (click)="onViewHistory(stock)">
                      View History
                    </button>
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      </div>
    </div>
    @if (isChartVisible()) {
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <div class="card-title">{{ chartTitle() }}</div>
          </div>
          <div class="card-body">
            <div class="row">
              <div class="col-md-11" style="min-height: 500px">
                <ngx-charts-line-chart
                  [scheme]="colorScheme"
                  [legend]="legend"
                  [showXAxisLabel]="showXAxisLabel"
                  [showYAxisLabel]="showYAxisLabel"
                  [xAxis]="xAxis"
                  [yAxis]="yAxis"
                  [xAxisLabel]="xAxisLabel"
                  [yAxisLabel]="yAxisLabel"
                  [timeline]="timeline"
                  [results]="multi()"
                >
                </ngx-charts-line-chart>
              </div>
              <div class="col-md-1"></div>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
