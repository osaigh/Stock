<div class="navb">
  <div class="wrapper">
    <div class="menu" (click)="toggleState()">
      <span class="icon"><i class="fa-solid fa-bars"></i></span>
    </div>
    @if (isUserSignedIn()) {
      <div>
        <div class="items">
          <div class="items">
            <img src="user2-160x160.jpg" alt="" class="avatar" />
          </div>

          <div class="items">
            <button type="button" (click)="signOut()" class="btn btn-primary">Sign Out</button>
          </div>
        </div>
      </div>
    } @else {
      <div class="items">
        <div class="items">
          <button type="button" (click)="signIn()" class="btn btn-primary">Sign In</button>
        </div>
      </div>
    }
  </div>
</div>
